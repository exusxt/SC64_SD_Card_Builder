name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main
        run: npm run build

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Create/update GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f release-notes.md ] && grep -q "$GITHUB_REF_NAME" release-notes.md; then
            gh release create "$GITHUB_REF_NAME" --notes-file release-notes.md \
              || gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes || true
          fi

      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Remove redundant multi-arch portable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $multi = Get-ChildItem dist -Filter 'SC64-SD-Card-Builder-*.exe' |
            Where-Object { $_.Name -notmatch 'Setup' -and $_.Name -notmatch '-x64\.exe$' -and $_.Name -notmatch '-arm64\.exe$' } |
            Select-Object -First 1
          if ($multi) {
            $multi | Remove-Item -Force
            if ($env:GITHUB_REF -like 'refs/tags/v*') {
              gh release delete-asset "$env:GITHUB_REF_NAME" "$($multi.Name)" --yes
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.blockmap
            dist/*.yml
