appId: dev.sc64.sdcardbuilder
productName: SC64 SD Card Builder
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.ico
  executableName: sc64-sd-card-builder
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Utility
  maintainer: sc64-tools
  synopsis: Prepare an SD card for the SummerCart64
npmRebuild: false
publish:
  provider: github
  owner: exusxt
  repo: SC64_SD_Card_Builder
  releaseType: draft
